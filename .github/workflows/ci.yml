# Audit, lint, typecheck and test on every push and pull request. No deploy
# and no Azure identity yet; that arrives with the infra step.
#
# Actions are pinned to commits, not tags, as in GLK: a tag can be moved. The
# version is in the comment beside each pin so a bump is a one-line change.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # packages/db tests run against a real Postgres. The service's superuser is
    # hockey_owner, the role that owns the tables on Neon; the tests apply
    # infra/neon/roles.sql themselves.
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: hockey_owner, POSTGRES_PASSWORD: hockey, POSTGRES_DB: hockey_test }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://hockey_owner:hockey@localhost:5432/hockey_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@a15d269cd4658e1107c09f1fabf4cbd7bd1f308a # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level=high
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      # The web build must not need a database: every page renders per request.
      - run: pnpm build
